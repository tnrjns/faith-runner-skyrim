; Faith Runner for Skyrim: Mirror's Edge's movement, animation and camera for the player.

[General]
; Your Mirror's Edge folder (the one with TdGame in it). Empty: the usual install folders.
; Faith's animations are read from it at startup; without it she moves but isn't animated.
sMirrorsEdgeDir=
; Key that switches Faith on and off (DirectInput scan code; 0x42 = F8).
iToggleKey=0x42
; Faith from the moment a save loads.
bStartEnabled=0
; Mouse look (1 = the same as the Faith Runner app).
fMouseSensitivity=1.0
; Animate the third-person body as well as the first-person arms.
bThirdPersonBody=1
; In first person, draw Faith's own Mirror's Edge body (arms, torso, legs) instead of Skyrim's arms.
bFaithViewmodel=1
; Key that goes round first person's views: Faith's body, Skyrim's whole body, Skyrim's arms (0x41 = F7).
iViewmodelKey=0x41
; When Faith's own body is drawn: 0 = automatic (late with Community Shaders, which lights the
; world deferred and paints over anything drawn into it), 1 = into the world (Skyrim's lighting and
; tone mapping, legs behind walls), 2 = late, just before the HUD.
iDrawStage=0
; Mirror's Edge's speed blur when running fast (first person).
bSpeedBlur=1
; Skyrim's view shows its whole body (chest and legs, head hidden); 0 = just its arms.
bSkyrimBody=1
; Key that saves all the collision loaded around you, for the parkour tool (0x44 = F10).
iSurveyKey=0x44
; Key that plays one of Faith's idles (0x22 = G). She also plays them by herself after 30-40 s standing still.
iIdleKey=0x22
; Skyrim's near clip distance while Faith is on (units; Skyrim's own is 15): walls close to her
; camera aren't cut away. 0 leaves Skyrim's.
fNearDistance=3.0
; The same in the whole-body view (Community Shaders' screen-space effects break down with the
; body right against the camera).
fNearDistanceBody=10.0
; Faith's sounds from Mirror's Edge (footsteps, breathing, landings, wind): 0 = off, 1 = full.
fSoundVolume=0.8

; Key that toggles walking, like Skyrim's always-run (0x3A = Caps Lock).
iWalkKey=0x3A
; Walking: the movement keys as this much of a stick (Mirror's Edge walks with the stick part way).
fWalkStick=0.3
; Skyrim's whole-body view: the camera this far ahead of Faith's eye (units), and this much more
; looking straight down (out of the neck, collar and chest).
fBodyCameraForward=5
fBodyCameraForwardDown=10

[Collision]
; How much of Skyrim's collision around you Faith moves on (game units; 70 a metre).
fRadius=2400
fHeight=1400
; How often it's read again (seconds; also whenever you've moved a quarter of the radius).
fRefreshSeconds=0.5

[Course]
; The training courses from the Faith Runner app (Mod Control Panel > Faith Runner > Course).
; Key that puts you back at the last checkpoint while on one (0x13 = R).
iRespawnKey=0x13
; How far above where you start it the course is built (game units; 70 a metre).
fHeight=20000
